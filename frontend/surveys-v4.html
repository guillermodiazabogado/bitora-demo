<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITORA - Encuestas V4</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #f6f7f9; color: #18202a; font-family: system-ui, sans-serif; margin: 0; }
    main { max-width: 1120px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    section { background: #fff; border: 1px solid #d9dee7; border-radius: 8px; margin-bottom: 16px; padding: 16px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
    input, select, textarea { border: 1px solid #c9d1dc; border-radius: 6px; font: inherit; padding: 9px; }
    textarea { min-height: 84px; resize: vertical; }
    button { border: 0; border-radius: 6px; background: #174ea6; color: white; cursor: pointer; font-weight: 700; padding: 10px 14px; }
    button.secondary { background: #415166; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e4e8ef; padding: 8px; text-align: left; }
    .status { border-radius: 999px; background: #eef3fb; display: inline-block; padding: 4px 8px; }
    .muted { color: #607080; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Encuestas V4</h1>
        <div class="muted">Foundation de encuestas versionadas, respuestas y resultados.</div>
      </div>
      <div class="producer-module-actions">
        <a id="producerHomeLink" class="producer-home-return-link" href="/#home">⌂ Volver al Home</a>
        <button id="refreshBtn" class="secondary">Actualizar</button>
      </div>
    </header>

    <section>
      <h2>Evento</h2>
      <div class="grid">
        <label>Event ID <input id="eventId" type="number" min="1" value="1"></label>
        <label>Nombre <input id="surveyName" value="Encuesta de satisfaccion"></label>
        <label>Modo
          <select id="responseMode">
            <option value="IDENTIFIED">Identificada</option>
            <option value="ANONYMOUS">Anonima</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <h2>Crear encuesta base</h2>
      <div class="grid">
        <label>Tipo <input id="typeCode" value="SATISFACTION"></label>
        <label>Titulo version <input id="versionTitle" value="Encuesta posterior al evento"></label>
      </div>
      <p class="muted">Crea tipo, encuesta, version con preguntas simples, publica y asigna al evento.</p>
      <button id="createBtn">Crear y publicar</button>
    </section>

    <section>
      <h2>Encuestas</h2>
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Modo</th><th>Estado</th><th>Version</th></tr></thead>
        <tbody id="surveyRows"><tr><td colspan="5" class="muted">Sin datos cargados.</td></tr></tbody>
      </table>
    </section>

    <section>
      <h2>Resultado</h2>
      <pre id="output" class="muted"></pre>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    function updateHomeLink() {
      const eventId = $("eventId").value || new URLSearchParams(location.search).get("event_id") || "";
      $("producerHomeLink").href = eventId ? `/?event_id=${encodeURIComponent(eventId)}#home` : "/#home";
    }
    const queryEventId = new URLSearchParams(location.search).get("event_id");
    if (queryEventId) $("eventId").value = queryEventId;
    const json = (url, options = {}) => fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } }).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || data.code || r.statusText);
      return data;
    });
    const questions = [
      { key: "SAT", prompt: "Satisfaccion general", type: "SCALE", required: true, config: { min: 1, max: 5 } },
      { key: "NPS", prompt: "Recomendarias el evento", type: "YES_NO", required: true },
      { key: "ROOM", prompt: "Sala preferida", type: "SINGLE_CHOICE", required: true, options: [{ key: "A", label: "Sala A" }, { key: "B", label: "Sala B" }] },
      { key: "COMMENT", prompt: "Comentario", type: "LONG_TEXT", required: false }
    ];
    function body(data) { return { method: "POST", body: JSON.stringify(data) }; }
    async function loadSurveys() {
      const eventId = $("eventId").value;
      const data = await json(`/api/surveys?event_id=${eventId}`);
      $("surveyRows").innerHTML = data.items.length ? data.items.map((item) => `<tr><td>${item.id}</td><td>${item.name}</td><td>${item.response_mode}</td><td><span class="status">${item.status}</span></td><td>${item.current_version_id || ""}</td></tr>`).join("") : `<tr><td colspan="5" class="muted">No hay encuestas.</td></tr>`;
      $("output").textContent = JSON.stringify(data, null, 2);
    }
    async function createSurvey() {
      const eventId = Number($("eventId").value);
      const type = await json("/api/survey-types", body({ event_id: eventId, code: $("typeCode").value, name: $("typeCode").value }));
      const survey = await json("/api/surveys", body({ event_id: eventId, survey_type_id: type.item.id, name: $("surveyName").value, response_mode: $("responseMode").value, access_policy: $("responseMode").value === "ANONYMOUS" ? "TOKEN" : "EVENT_PARTICIPANTS", duplicate_policy: $("responseMode").value === "ANONYMOUS" ? "ONE_PER_TOKEN" : "ONE_PER_PARTICIPANT" }));
      const version = await json(`/api/surveys/${survey.item.id}/versions`, body({ event_id: eventId, title: $("versionTitle").value, questions }));
      await json(`/api/surveys/${survey.item.id}/versions/${version.item.id}/publish`, body({ event_id: eventId, idempotency_key: `publish-${Date.now()}` }));
      await json(`/api/events/${eventId}/surveys/${survey.item.id}/assign`, body({ version_id: version.item.id }));
      await loadSurveys();
    }
    $("refreshBtn").addEventListener("click", () => loadSurveys().catch((e) => $("output").textContent = e.message));
    $("createBtn").addEventListener("click", () => createSurvey().catch((e) => $("output").textContent = e.message));
    $("eventId").addEventListener("input", updateHomeLink);
    updateHomeLink();
  </script>
</body>
</html>

name: BITORA CI

on:
  pull_request:
  push:
    branches:
      - develop/v4
      - deployment/v4-online

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall backend server.py verificar_v4.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Docker build
        run: docker build -t bitora-ci .

name: BITORA Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-production
    env:
      BITORA_ANDROID_PRODUCTION_BASE_URL: ${{ vars.BITORA_ANDROID_PRODUCTION_BASE_URL }}
      BITORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BITORA_ANDROID_KEYSTORE_PASSWORD }}
      BITORA_ANDROID_KEY_ALIAS: ${{ secrets.BITORA_ANDROID_KEY_ALIAS }}
      BITORA_ANDROID_KEY_PASSWORD: ${{ secrets.BITORA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize production signing key
        env:
          BITORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.BITORA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$BITORA_ANDROID_KEYSTORE_BASE64"
          test -n "$BITORA_ANDROID_KEYSTORE_PASSWORD"
          test -n "$BITORA_ANDROID_KEY_ALIAS"
          test -n "$BITORA_ANDROID_KEY_PASSWORD"
          test -n "$BITORA_ANDROID_PRODUCTION_BASE_URL"
          keystore="$RUNNER_TEMP/bitora-production.jks"
          printf '%s' "$BITORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "BITORA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Run production preflight
        shell: pwsh
        run: ./tools/android_production_preflight.ps1 -ProductionBaseUrl $env:BITORA_ANDROID_PRODUCTION_BASE_URL
      - name: Build signed release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            :apps:operation:assembleRelease \
            :apps:display:assembleRelease \
            "-PbitoraProductionBaseUrl=$BITORA_ANDROID_PRODUCTION_BASE_URL"
      - name: Verify signatures and checksums
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          operation="android/apps/operation/build/outputs/apk/release/operation-release.apk"
          display="android/apps/display/build/outputs/apk/release/display-release.apk"
          "$apksigner" verify --verbose --print-certs "$operation"
          "$apksigner" verify --verbose --print-certs "$display"
          sha256sum "$operation" "$display" > android-release-sha256.txt
      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bitora-android-production-${{ github.sha }}
          path: |
            android/apps/operation/build/outputs/apk/release/operation-release.apk
            android/apps/display/build/outputs/apk/release/display-release.apk
            android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITORA Operations Center</title>
  <style>
    :root {
      --ink: #071926;
      --muted: #5d7185;
      --line: #d8e2ea;
      --panel: #ffffff;
      --bg: #eef4f6;
      --teal: #0d8c8c;
      --teal-dark: #06656a;
      --green: #107c4c;
      --amber: #b7791f;
      --red: #ba2d21;
      --blue: #2368c4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px clamp(16px, 4vw, 42px);
      background: #061923;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .brand span { color: #b8c7cf; font-size: 14px; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 9px 13px;
      background: var(--teal);
      color: #fff;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: #e9fbfb;
      border-color: #b9e2e2;
      color: #073844;
    }

    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px clamp(14px, 3vw, 32px) 42px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(220px, 340px);
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .headline,
    .status-card,
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(7, 25, 38, .05);
    }

    .headline { padding: 22px; }
    .status-card { padding: 18px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(30px, 4vw, 46px); line-height: 1.02; }
    h2 { margin-bottom: 12px; font-size: 20px; }
    h3 { margin-bottom: 8px; font-size: 16px; }
    p { color: var(--muted); line-height: 1.45; }

    .status-label {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e7f7ef;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    .status-label.preparation { background: #fff4d7; color: var(--amber); }
    .status-label.degraded { background: #ffe3df; color: var(--red); }

    .score {
      display: flex;
      align-items: end;
      gap: 8px;
      margin: 18px 0 4px;
    }

    .score strong { font-size: 46px; line-height: 1; }
    .score span { color: var(--muted); font-weight: 700; padding-bottom: 6px; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric { padding: 16px; min-height: 112px; }
    .metric .label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .metric .value { margin-top: 10px; font-size: 34px; line-height: 1; font-weight: 850; }
    .metric .source { margin-top: 8px; color: var(--muted); font-size: 12px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(300px, 1.1fr) minmax(300px, .9fr);
      gap: 14px;
      align-items: start;
    }

    .card { padding: 18px; }
    .readiness-list, .work-list { display: grid; gap: 10px; }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid #e2ebf1;
      border-radius: 7px;
      background: #fbfdfe;
    }

    .item b { display: block; margin-bottom: 3px; }
    .item p { margin: 0; font-size: 13px; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e7f7ef;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .pill.warning { background: #fff4d7; color: var(--amber); }
    .pill.blocked, .pill.critical, .pill.high { background: #ffe3df; color: var(--red); }
    .pill.medium { background: #eaf1ff; color: var(--blue); }
    .muted { color: var(--muted); }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .empty {
      padding: 16px;
      border: 1px dashed #c9d8e2;
      border-radius: 7px;
      color: var(--muted);
      background: #fbfdfe;
    }

    .error {
      padding: 14px;
      border-left: 4px solid var(--red);
      border-radius: 7px;
      background: #fff;
      color: var(--red);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .hero, .dashboard-grid, .split { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { justify-content: flex-start; }
      .metric-grid { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>BITORA</strong>
      <span>Centro operativo del evento</span>
    </div>
    <div class="top-actions">
      <a id="producerHomeLink" class="btn secondary" href="/#home">Volver al Home</a>
      <a id="appLink" class="btn" href="/">Abrir BITORA</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="headline">
        <p class="eyebrow">Operations Center</p>
        <h1>Tablero de comando</h1>
        <p id="event">Selecciona un evento para ver el estado operativo.</p>
      </div>
      <aside class="status-card">
        <span id="status" class="status-label">Sin datos</span>
        <div class="score">
          <strong id="score">--</strong>
          <span>readiness</span>
        </div>
        <p id="updated" class="muted">Esperando informacion del evento.</p>
      </aside>
    </section>

    <section id="metrics" class="metric-grid"></section>

    <section class="dashboard-grid">
      <article class="card">
        <h2>Readiness</h2>
        <div id="readiness" class="readiness-list"></div>
      </article>

      <div>
        <article class="card">
          <h2>Alertas</h2>
          <div id="alerts" class="work-list"></div>
        </article>
        <div class="split">
          <article class="card">
            <h2>Incidentes</h2>
            <div id="incidents" class="work-list"></div>
          </article>
          <article class="card">
            <h2>Tareas</h2>
            <div id="tasks" class="work-list"></div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get("event_id");
    const homeHref = eventId ? `/?event_id=${encodeURIComponent(eventId)}#home` : "/#home";
    document.getElementById("producerHomeLink").href = homeHref;
    document.getElementById("appLink").href = eventId ? `/?event_id=${encodeURIComponent(eventId)}` : "/";

    const metricLabels = {
      registered: "Inscriptos",
      confirmed: "Confirmados",
      accredited: "Acreditados",
      absent: "Pendientes",
      activities: "Actividades",
      reservations: "Reservas",
      waitlist: "Lista de espera",
      access_allowed: "Accesos OK",
      access_denied: "Accesos rechazados",
      speakers_confirmed: "Speakers confirmados",
      certificates_issued: "Certificados emitidos",
      surveys_active: "Encuestas activas",
      alerts_open: "Alertas abiertas",
      incidents_open: "Incidentes abiertos",
      tasks_overdue: "Tareas vencidas"
    };

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const statusClass = (value) => {
      const text = String(value || "").toLowerCase();
      if (text.includes("degraded") || text.includes("blocked") || text.includes("critical")) return "degraded";
      if (text.includes("preparation") || text.includes("warning")) return "preparation";
      return "";
    };

    const pillClass = (value) => {
      const text = String(value || "").toLowerCase();
      if (text.includes("blocked")) return "blocked";
      if (text.includes("critical")) return "critical";
      if (text.includes("high")) return "high";
      if (text.includes("medium")) return "medium";
      if (text.includes("warning") || text.includes("open")) return "warning";
      return "";
    };

    function renderMetric(key, metric) {
      return `
        <article class="card metric">
          <div class="label">${esc(metricLabels[key] || key)}</div>
          <div class="value">${esc(metric?.value ?? 0)}</div>
          <div class="source">${esc(metric?.source || "evento")}</div>
        </article>
      `;
    }

    function renderReadiness(items) {
      if (!items?.length) return '<div class="empty">Sin checks de readiness.</div>';
      return items.map((item) => `
        <div class="item">
          <span class="pill ${pillClass(item.status)}">${esc(item.status)}</span>
          <div>
            <b>${esc(item.message)}</b>
            <p>${esc(item.recommendation || item.source || "Sin observaciones.")}</p>
          </div>
        </div>
      `).join("");
    }

    function renderAlerts(items) {
      if (!items?.length) return '<div class="empty">Sin alertas abiertas.</div>';
      return items.map((item) => `
        <div class="item">
          <span class="pill ${pillClass(item.severity)}">${esc(item.severity)}</span>
          <div>
            <b>${esc(item.message)}</b>
            <p>${esc(item.status)} - ${esc(item.source || "operations")}</p>
          </div>
        </div>
      `).join("");
    }

    function renderWork(items, type) {
      if (!items?.length) return `<div class="empty">Sin ${type} abiertos.</div>`;
      return items.map((item) => `
        <div class="item">
          <span class="pill ${pillClass(item.priority || item.severity || item.status)}">${esc(item.priority || item.severity || item.status)}</span>
          <div>
            <b>${esc(item.title)}</b>
            <p>${esc(item.status)}${item.assignee ? ` - ${esc(item.assignee)}` : ""}</p>
          </div>
        </div>
      `).join("");
    }

    async function load() {
      if (!eventId) {
        document.getElementById("metrics").innerHTML = '<div class="error">Falta seleccionar evento.</div>';
        return;
      }
      const response = await fetch(`/api/events/${encodeURIComponent(eventId)}/operations-center`);
      const data = await response.json();
      if (!response.ok || data.ok === false) {
        document.getElementById("status").textContent = "No disponible";
        document.getElementById("metrics").innerHTML = `<div class="error">${esc(data.error || "No se pudo cargar Operations Center.")}</div>`;
        return;
      }

      const status = data.operational_status || "READY";
      document.getElementById("event").textContent = `${data.event?.name || "Evento"} - ID ${data.event?.id || eventId}`;
      document.getElementById("status").textContent = status;
      document.getElementById("status").className = `status-label ${statusClass(status)}`;
      document.getElementById("score").textContent = data.readiness?.score ?? "--";
      document.getElementById("updated").textContent = `Ultima actualizacion: ${data.updated_at || "sin fecha"}`;
      document.getElementById("metrics").innerHTML = Object.entries(data.metrics || {}).map(([key, metric]) => renderMetric(key, metric)).join("");
      document.getElementById("readiness").innerHTML = renderReadiness(data.readiness?.items || []);
      document.getElementById("alerts").innerHTML = renderAlerts(data.alerts || []);
      document.getElementById("incidents").innerHTML = renderWork(data.incidents || [], "incidentes");
      document.getElementById("tasks").innerHTML = renderWork(data.tasks || [], "tareas");
    }

    load();
  </script>
</body>
</html>

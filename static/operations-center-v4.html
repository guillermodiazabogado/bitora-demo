<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BITORA Operations Center</title>
<style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#1e293b}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.status{font-weight:700;color:#087f5b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}.card{background:white;border:1px solid #dbe3ef;border-radius:8px;padding:16px}.value{font-size:28px;font-weight:750}.muted{color:#64748b;font-size:13px}.section{margin-top:20px}.item{padding:10px 0;border-bottom:1px solid #edf1f7}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8f5ef;color:#087f5b;font-size:12px;font-weight:700}</style></head>
<body><main class="wrap"><div class="hero"><div><div class="muted">BITORA STAGING</div><h1>Operations Center</h1><p id="event" class="muted">Seleccioná un evento para ver el estado operativo.</p></div><div id="status" class="status">Sin datos</div></div><div id="metrics" class="grid"></div><section class="section card"><h2>Readiness</h2><div id="readiness"></div></section><section class="section card"><h2>Alertas</h2><div id="alerts"></div></section><section class="section card"><h2>Incidentes y tareas</h2><div id="work"></div></section></main>
<script>const eventId=new URLSearchParams(location.search).get('event_id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!eventId)return;const r=await fetch(`/api/events/${eventId}/operations-center`);const d=await r.json();if(!r.ok){document.getElementById('status').textContent=d.error||'No disponible';return}document.getElementById('event').textContent=`${d.event.name} · ${d.updated_at}`;document.getElementById('status').textContent=d.operational_status;document.getElementById('metrics').innerHTML=Object.entries(d.metrics).map(([k,v])=>`<article class="card"><div class="muted">${esc(k)}</div><div class="value">${v.value}</div><div class="muted">${esc(v.source)}</div></article>`).join('');document.getElementById('readiness').innerHTML=d.readiness.items.map(x=>`<div class="item"><span class="pill">${esc(x.status)}</span> ${esc(x.message)} <span class="muted">${esc(x.recommendation)}</span></div>`).join('');document.getElementById('alerts').innerHTML=d.alerts.length?d.alerts.map(x=>`<div class="item"><b>${esc(x.severity)}</b> ${esc(x.message)} <span class="muted">${esc(x.status)}</span></div>`).join(''):'<div class="muted">Sin alertas.</div>';document.getElementById('work').innerHTML=[...d.incidents.map(x=>`<div class="item">Incidente: ${esc(x.title)} · ${esc(x.status)}</div>`),...d.tasks.map(x=>`<div class="item">Tarea: ${esc(x.title)} · ${esc(x.status)}</div>`)].join('')||'<div class="muted">Sin incidentes ni tareas.</div>'}load();</script></body></html>

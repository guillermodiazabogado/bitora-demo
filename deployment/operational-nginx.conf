upstream bitora_operational {
    least_conn;
    server app1:8787 max_fails=2 fail_timeout=5s;
    server app2:8787 max_fails=2 fail_timeout=5s;
}

server {
    listen 8080;
    server_name bitora-operational.local localhost 127.0.0.1;

    location / {
        proxy_pass http://bitora_operational;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 4s;
    }
}


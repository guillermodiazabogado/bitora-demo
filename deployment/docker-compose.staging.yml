services:
  bitora-staging-postgres:
    image: postgres:16-alpine
    container_name: bitora-staging-postgres
    environment:
      POSTGRES_DB: bitora_staging
      POSTGRES_USER: bitora_staging
      POSTGRES_PASSWORD: bitora_staging_password
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "55432:5432"
    volumes:
      - bitora-staging-postgres:/var/lib/postgresql/data
      - bitora-staging-pgbackups:/bitora/pgbackups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitora_staging -d bitora_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  bitora-staging-app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.staging
    container_name: bitora-staging-app
    env_file:
      - staging/.env.staging
    environment:
      QR_POSTGRES_DSN: postgresql://bitora_staging:bitora_staging_password@bitora-staging-postgres:5432/bitora_staging
      DATABASE_URL: postgresql://bitora_staging:bitora_staging_password@bitora-staging-postgres:5432/bitora_staging
      BITORA_DISABLE_EMBEDDED_WORKER: "1"
    ports:
      - "8788:8787"
    volumes:
      - bitora-staging-storage:/bitora/storage
      - bitora-staging-backups:/bitora/backups
      - bitora-staging-logs:/bitora/logs
    depends_on:
      bitora-staging-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    command: ["python", "backend/app.py"]

  bitora-staging-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.staging
    container_name: bitora-staging-worker
    env_file:
      - staging/.env.staging
    environment:
      QR_POSTGRES_DSN: postgresql://bitora_staging:bitora_staging_password@bitora-staging-postgres:5432/bitora_staging
      DATABASE_URL: postgresql://bitora_staging:bitora_staging_password@bitora-staging-postgres:5432/bitora_staging
      BITORA_DISABLE_EMBEDDED_WORKER: "0"
    volumes:
      - bitora-staging-storage:/bitora/storage
      - bitora-staging-backups:/bitora/backups
      - bitora-staging-logs:/bitora/logs
    depends_on:
      bitora-staging-postgres:
        condition: service_healthy
    command: ["python", "backend/worker.py"]

  bitora-staging-monitor:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.staging
    container_name: bitora-staging-monitor
    env_file:
      - staging/.env.staging
    depends_on:
      bitora-staging-app:
        condition: service_healthy
    command: ["python", "deployment/scripts/bdf_monitor.py"]

volumes:
  bitora-staging-postgres:
  bitora-staging-pgbackups:
  bitora-staging-storage:
  bitora-staging-backups:
  bitora-staging-logs:
